<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        html {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .page-container {
            width: 1080px;
            height: 1920px;
            position: relative;
            overflow: hidden;
        }

        /* Background Media Layer */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .background-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .background-layer:empty {
            display: none;
        }

        /* Gradient overlay for readability */
        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.0) 25%,
                    rgba(0, 0, 0, 0.0) 60%,
                    rgba(0, 0, 0, 0.65) 100%);
        }

        /* Subtitle wrapper — position injected via {{subtitle_position_css}} */
        .subtitle-wrapper {
            position: absolute;
            left: 80px;
            right: 80px;
            z-index: 2;
            text-align: center;
            {{subtitle_position_css}}
        }

        /* Subtitle text — style injected via {{subtitle_style_css}} */
        .text {
            font-size: 52px;
            font-weight: 500;
            line-height: 1.6;
            text-align: center;
            word-break: break-all;
            white-space: pre-line;
            {{subtitle_style_css}}
        }
    </style>
</head>

<body>
    <div class="page-container">
        <!-- Background: image for image assets, empty (hidden) for video assets -->
        <div class="background-layer" id="bg-layer"></div>

        <!-- Gradient overlay -->
        <div class="gradient-overlay"></div>

        <!-- Subtitle -->
        <div class="subtitle-wrapper">
            <div class="text">{{text}}</div>
        </div>
    </div>

    <script>
        (function () {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var img = document.createElement('img');
                img.src = imageUrl;
                img.alt = "Background";
                bgLayer.appendChild(img);
            }
        })();
    </script>
</body>

</html>
